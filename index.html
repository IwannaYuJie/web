<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/cat-avatar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="橘猫小窝：随手记的技术笔记。Java、AI、自己折腾的小项目都丢在这，想到再写，更得很慢。" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700;900&family=Patrick+Hand&family=Space+Grotesk:wght@500;600;700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var validThemes = ['paper', 'sketch', 'cyberpunk', 'pixel', 'y2k', 'matrix', 'bubble', 'blueprint'];
          var saved = localStorage.getItem('cat_blog_theme_style');
          if (validThemes.indexOf(saved) !== -1) {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'paper');
          }
        } catch (e) {}
      })();
    </script>
    <title>橘猫小窝 - 个人博客</title>
  </head>
  <body>
    <!-- React 应用挂载点 -->
    <div id="root"></div>
    <!-- Vite 会自动注入这个脚本 -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
