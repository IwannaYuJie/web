      />
    </noscript>
    <meta id="theme-color-meta" name="theme-color" content="#F4EFE4" />
    <script>
      (function() {
        try {
          var root = document.documentElement;
          root.removeAttribute('data-theme');
          localStorage.removeItem('cat_blog_theme_style');
          var saved = localStorage.getItem('orange_cat_color_mode');
          var mode = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          root.setAttribute('data-color-mode', mode);
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', mode === 'dark' ? '#0D1216' : '#F4EFE4');
          }
        } catch (e) {}
      })();
    </script>
    <title>橘猫小窝 · 云深不知处</title>
